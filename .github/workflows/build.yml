name: Build ModerationPlugin JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java (JDK 25)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Compiler le .jar avec Maven
        run: |
          if [ -f "ModerationPlugin/pom.xml" ]; then
            mvn clean package -f ModerationPlugin/pom.xml
          else
            mvn clean package
          fi

      - name: Publier le fichier .jar généré
        uses: actions/upload-artifact@v4
        with:
          name: ModerationPlugin-JAR
          path: "**/target/*.jar"
